<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITLE}} — Samuel Chan-ashing</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#f0ebe3">
  <link rel="icon" href="../assets/img/favicon.png">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="../assets/css/site.css">
  <link rel="stylesheet" href="../assets/css/paper.css">
  <style>:root { --tint: {{TINT}}; }</style>
</head>
<body data-page="stay" class="reader">
<script src="../assets/js/icons.js"></script>
<div class="page-tint"></div>

<div class="topfade"></div>
<div class="topbar">
  <a class="circle-btn glass" href="../index.html#research" aria-label="Back"><svg class="icon"><use href="#i-chev-l"/></svg></a>
  <span class="topbar-title">{{TITLE}}</span>
  <div class="pill-btns glass">
    <button type="button" data-action="theme" aria-label="Dark mode"><svg class="icon"><use href="#i-moon"/></svg></button>
    <button type="button" data-action="share" aria-label="Share"><svg class="icon"><use href="#i-share"/></svg></button>
    <button type="button" data-action="menu" aria-label="More" aria-haspopup="menu" aria-expanded="false"><svg class="icon"><use href="#i-dots"/></svg></button>
  </div>
</div>
<div class="menu glass" role="menu">
  <a href="{{PDF}}" target="_blank" rel="noopener" role="menuitem">PDF <svg class="icon"><use href="#i-doc"/></svg></a>
  <a href="../index.html#research" role="menuitem">All research <svg class="icon"><use href="#i-sigma"/></svg></a>
  <hr>
  <button type="button" data-copy="url" data-msg="Link copied" role="menuitem">Copy link <svg class="icon"><use href="#i-link"/></svg></button>
</div>

<main>
  <div class="wrap">
    <header class="album-head">
      <div class="album-cover"><img src="../assets/img/covers/{{COVER}}" alt="Artwork: simulation related to {{SHORT}}" width="800" height="800"></div>
      <div class="album-info">
        <h1 class="album-title">{{TITLE}}</h1>
        <div class="album-artist">{{AUTHORS}}</div>
        {{ORIGINAL}}
        <div class="album-meta">{{META}}</div>
        <div class="album-actions">
          <a class="cta" href="{{PDF}}" target="_blank" rel="noopener"><svg class="icon"><use href="#i-doc"/></svg> PDF</a>
        </div>
        <div class="album-desc" id="abstract" lang="{{LANG}}">{{ABSTRACT}}</div>
      </div>
    </header>

    <section class="block" aria-label="Contents">
      <ol class="rows tracks">
{{TRACKS}}
      </ol>
      <div class="album-foot">{{FOOT}}</div>
      <ul class="chips">{{KEYWORDS}}</ul>
    </section>

    {{LANGNOTE}}
    <article class="paper" id="paper-body" lang="{{LANG}}" data-static>
{{BODY}}
    </article>

    <section class="block" id="more-by">
      <h2 class="section-head">More research stays</h2>
      <ul class="carousel">
{{MORE}}
      </ul>
    </section>
  </div>
</main>

<div class="dock" data-active="research">
  <nav class="tabs glass" aria-label="Sections">
    <a class="tab" href="../index.html#top" data-tab="home" data-icon="home"><svg class="icon"><use href="#i-home"/></svg><span>Home</span></a>
    <a class="tab" href="../index.html#research" data-tab="research" data-icon="sigma"><svg class="icon"><use href="#i-sigma"/></svg><span>Research</span></a>
    <a class="tab" href="../index.html#vita" data-tab="vita" data-icon="vita"><svg class="icon"><use href="#i-vita"/></svg><span>Vita</span></a>
    <a class="tab" href="../index.html#teaching" data-tab="teaching" data-icon="cap"><svg class="icon"><use href="#i-cap"/></svg><span>Teaching</span></a>
    <a class="tab" href="../agregation.html" data-tab="agreg" data-icon="books"><svg class="icon"><use href="#i-books"/></svg><span>Agrégation</span></a>
  </nav>
  <button class="orb orb-right glass" type="button" aria-label="Show sections"><svg class="icon"><use href="#i-sigma"/></svg></button>
</div>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/reader.js"></script>
</body>
</html>
